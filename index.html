<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediCam – Web OEM (Clinical)</title>
<meta name="description" content="Endoscope web viewer with full clinical controls and presets.">
<style>
:root{
  --bg:#000; --fg:#fff; --muted:#cfcfcf; --line:#202020;
  --accent:#22c55e; --danger:#ff2d2d;
  --chip:#0e0e0e; --chip-bd:#2a2a2a; --btn:#131313; --btn-bd:#3a3a3a; --btn-h:#191919;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
body{overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* Top bar */
.top{
  height:44px;display:grid;grid-template-columns:220px 220px 1fr auto auto auto;
  gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:#000
}
.brand{font-weight:800;font-size:22px}
.pill, select{
  height:30px;padding:6px 10px;background:var(--chip);color:#fff;border:1px solid var(--chip-bd);border-radius:6px;font-size:13px
}
.btn{height:30px;padding:5px 12px;background:var(--btn);color:#ddd;border:1px solid var(--btn-bd);border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--btn-h)}
.label{color:var(--muted);font-size:13px}

/* Main */
.main{height:100%;display:grid;grid-template-columns:84px 1fr 300px}

/* Left tools */
.sidebar{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.tool{
  width:60px;height:60px;border:2px solid #fff;border-radius:14px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer
}
.tool:hover{background:#0f0f0f}
.vslider-wrap{margin-top:6px;display:flex;flex-direction:column;align-items:center}
.rot-txt{font-size:11px;margin-top:4px;color:#ddd}
input[type="range"].v{writing-mode:bt-lr;-webkit-appearance:slider-vertical;width:14px;height:180px}

/* Center canvas */
.center{display:flex;align-items:center;justify-content:center;position:relative}
.canvas-box{width:min(82vh,80vw);height:min(82vh,80vw);max-width:960px;max-height:960px;background:#000;border:1px solid var(--line);border-radius:12px;position:relative}
canvas{width:100%;height:100%;border-radius:12px;background:#000}
.rec-dot{position:absolute;right:12px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--danger);display:none;box-shadow:0 0 10px var(--danger)}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;color:#fff;display:none;font-size:12px}

/* Right dock */
.dock{border-left:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:14px}
.round{
  width:84px;height:84px;border:2px solid #fff;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer
}
.round:hover{background:#0e0e0e}
.round svg{width:40px;height:40px}
.hint{color:#bdbdbd;font-size:12px;margin-top:6px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{width:150px;height:100px;border:1px solid #fff;border-radius:10px;background:#0a0a0a;object-fit:cover;opacity:0;transform:scale(.96);transition:.18s}
.thumb.show{opacity:1;transform:scale(1)}

/* Settings drawer + mask */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:60}
.panel{
  position:fixed;top:0;right:-380px;width:380px;height:100%;background:#0b0b0b;z-index:70;border-left:1px solid var(--line);
  transition:right .22s ease;overflow:auto;padding:16px
}
.panel.open{right:0}
.mask.show{display:block}
.p-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.p-title h3{margin:0;font-size:16px}
.x{width:30px;height:30px;border:1px solid #fff;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.group{margin:12px 0;border-top:1px solid #151515;padding-top:10px}
.row{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:10px;margin:8px 0}
.row label{color:#ddd;font-size:13px}
.badge{display:inline-block;background:var(--accent);color:#000;padding:2px 8px;border-radius:999px;font-weight:700;font-size:11px}
.preset-bar{display:flex;gap:8px}
.preset-btn{flex:1 1 0;background:#131313;border:1px solid #2e2e2e;color:#eaeaea;padding:8px;border-radius:8px;cursor:pointer}
.preset-btn:hover{background:#191919}
.small{font-size:11px;color:#aaa}
.active{outline:2px solid var(--accent);box-shadow:0 0 0 2px rgba(34,197,94,.25)}
/* SVG stroke color */
svg{stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
  <!-- Top -->
  <div class="top">
    <div class="brand">MediVisionTech</div>
    <select id="lang" class="pill"><option value="zh">繁體中文</option><option value="en">English</option></select>
    <div></div>
    <div class="label">Select camera</div>
    <select id="deviceSelect" class="pill"></select>
    <button class="btn" id="btnFind">Find device</button>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Left tools -->
    <aside class="sidebar">
      <button class="tool" id="tRotateL" title="逆時針 10°">
        <svg viewBox="0 0 24 24"><path d="M7 7v4H3M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9Z"/></svg>
      </button>
      <button class="tool" id="tRotateR" title="順時針 10°">
        <svg viewBox="0 0 24 24"><path d="M17 7v4h4M3 12a9 9 0 1 0 9-9"/></svg>
      </button>
      <button class="tool" id="tFlipX" title="左右鏡像">
        <svg viewBox="0 0 24 24"><path d="M3 5h8v14H3zM13 5l8 7-8 7z"/></svg>
      </button>
      <button class="tool" id="tFlipY" title="上下鏡像">
        <svg viewBox="0 0 24 24"><path d="M5 3v8h14V3zM5 13l7 8 7-8z"/></svg>
      </button>
      <button class="tool" id="tReset" title="重設">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 5v5h5"/></svg>
      </button>

      <div class="vslider-wrap">
        <input id="rotSlider" class="v" type="range" min="-180" max="180" value="0">
        <div class="rot-txt" id="rotTxt">Rotation 0°</div>
      </div>
    </aside>

    <!-- Center -->
    <main class="center">
      <div class="canvas-box" id="box">
        <canvas id="cv" width="624" height="624"></canvas>
        <div class="rec-dot" id="recDot"></div>
        <div class="toast" id="toast">Saved</div>
      </div>
    </main>

    <!-- Right dock -->
    <aside class="dock">
      <div class="hint">Actions</div>

      <!-- 截圖 -->
      <button class="round" id="bShot" title="截圖 (F10)">
        <svg viewBox="0 0 24 24">
          <path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="4"/>
        </svg>
      </button>

      <!-- 錄影/停止（單鍵雙態） -->
      <button class="round" id="bRec" title="錄影開/關 (F9)">
        <svg id="iconRec" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="6" fill="#ff2d2d" stroke="none"/>
        </svg>
      </button>

      <!-- 設定/收回 -->
      <button class="round" id="bSettings" title="設定/收回">
        <svg id="iconGear" viewBox="0 0 24 24">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
          <path d="M19.4 15a1 1 0 0 0 .2-1l-1-1.7 1-1.7a1 1 0 0 0-.2-1l-1.3-1.3a1 1 0 0 0-1-.2l-1.7 1-1.7-1a1 1 0 0 0-1 0l-1.7 1-1.7-1a1 1 0 0 0-1 .2L4.6 10a1 1 0 0 0-.2 1l1 1.7-1 1.7a1 1 0 0 0 .2 1l1.3 1.3a1 1 0 0 0 1 .2l1.7-1 1.7 1a1 1 0 0 0 1 0l1.7-1 1.7 1a1 1 0 0 0 1-.2z"/>
        </svg>
      </button>

      <div class="hint">Latest shots</div>
      <div class="thumbs" id="thumbs"></div>
    </aside>
  </div>
</div>

<!-- Mask + Settings -->
<div class="mask" id="mask"></div>
<div class="panel" id="panel">
  <div class="p-title">
    <h3>設定 <span class="badge">FULL</span></h3>
    <div class="x" id="pClose">✕</div>
  </div>

  <!-- 影像調整 -->
  <div class="group">
    <div class="row"><label>亮度</label><input id="sBright" type="range" min="50" max="150" value="110"><div class="small" id="vBright">1.10</div></div>
    <div class="row"><label>對比度</label><input id="sContrast" type="range" min="50" max="200" value="120"><div class="small" id="vContrast">1.20</div></div>
    <div class="row"><label>飽和度</label><input id="sSat" type="range" min="0" max="200" value="110"><div class="small" id="vSat">1.10</div></div>
    <div class="row"><label>銳利度</label><input id="sSharp" type="range" min="0" max="100" value="30"><div class="small" id="vSharp">0.30</div></div>
    <div class="row"><label>Gamma</label><input id="sGamma" type="range" min="80" max="180" value="120"><div class="small" id="vGamma">1.20</div></div>
  </div>

  <!-- 預設 -->
  <div class="group">
    <div class="row" style="grid-template-columns:130px 1fr;">
      <label>預設（V1/V2/V3）</label>
      <div class="preset-bar">
        <button class="preset-btn" data-slot="1" id="p1">套用 V1</button>
        <button class="preset-btn" data-slot="2" id="p2">套用 V2</button>
        <button class="preset-btn" data-slot="3" id="p3">套用 V3</button>
      </div>
    </div>
    <div class="row" style="grid-template-columns:130px 1fr;">
      <label>儲存目前到</label>
      <div class="preset-bar">
        <button class="preset-btn" data-save="1">儲存 V1</button>
        <button class="preset-btn" data-save="2">儲存 V2</button>
        <button class="preset-btn" data-save="3">儲存 V3</button>
      </div>
    </div>
    <div class="small">預設保存在瀏覽器（localStorage）。清除快取會一併刪除。</div>
  </div>
</div>

<script>
/* ==== 元件 ==== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const deviceSel=document.getElementById('deviceSelect'), btnFind=document.getElementById('btnFind');
const rotSlider=document.getElementById('rotSlider'), rotTxt=document.getElementById('rotTxt');
const tRotateL=document.getElementById('tRotateL'), tRotateR=document.getElementById('tRotateR');
const tFlipX=document.getElementById('tFlipX'), tFlipY=document.getElementById('tFlipY'), tReset=document.getElementById('tReset');

const bShot=document.getElementById('bShot'), bRec=document.getElementById('bRec'), bSettings=document.getElementById('bSettings');
const iconRec=document.getElementById('iconRec'), iconGear=document.getElementById('iconGear');
const recDot=document.getElementById('recDot'), toast=document.getElementById('toast'), thumbs=document.getElementById('thumbs');

const mask=document.getElementById('mask'), panel=document.getElementById('panel'), pClose=document.getElementById('pClose');

/* 設定滑桿 */
const sBright=document.getElementById('sBright'), vBright=document.getElementById('vBright');
const sContrast=document.getElementById('sContrast'), vContrast=document.getElementById('vContrast');
const sSat=document.getElementById('sSat'), vSat=document.getElementById('vSat');
const sSharp=document.getElementById('sSharp'), vSharp=document.getElementById('vSharp');
const sGamma=document.getElementById('sGamma'), vGamma=document.getElementById('vGamma');

/* ==== 狀態 ==== */
let stream=null, video=null, raf=null;
let flipX=false, flipY=false, deg=0;
let recording=false, recorder=null, chunks=[];

/* ==== 工具 ==== */
function toastOnce(msg){ toast.textContent=msg; toast.style.display='block'; setTimeout(()=>toast.style.display='none',1000); }
function setRotate(v){ deg=(Number(v)%360+360)%360; rotSlider.value=deg; rotTxt.textContent=`Rotation ${deg}°`; }
function rotate(d){ setRotate(deg+d); }
function resetAll(){ flipX=false; flipY=false; setRotate(0); }

/* ==== 影像濾鏡：集中計算，避免閃爍 ==== */
let filterStr='none', lastBuild=0;
function buildFilter(){
  // 銳利度用對比微強化（性能友善）
  const br=(+sBright.value/100).toFixed(2);
  const ct=(+sContrast.value/100 + (+sSharp.value/100)*0.4).toFixed(2); // 銳利帶動對比
  const st=(+sSat.value/100 + (+sSharp.value/100)*0.15).toFixed(2);     // 微量飽和
  const gm=(+sGamma.value/100).toFixed(2);
  filterStr=`brightness(${br}) contrast(${ct}) saturate(${st}) gamma(${gm})`;
}
[sBright,sContrast,sSat,sSharp,sGamma].forEach(s=>{
  s.oninput=()=>{ const v=(+s.value/100).toFixed(2); 
    ({sBright:vBright,sContrast:vContrast,sSat:vSat,sSharp:vSharp,sGamma:vGamma}[s.id]).textContent=v;
    // 節流：僅在動畫迴圈套用
    lastBuild=0; 
  };
});

/* ==== 渲染 ==== */
function loop(ts){
  if(!video){ raf=requestAnimationFrame(loop); return; }
  const w=video.videoWidth,h=video.videoHeight;
  if(w&&h){
    ctx.save(); ctx.clearRect(0,0,cv.width,cv.height);
    ctx.translate(cv.width/2, cv.height/2);
    ctx.scale(flipX?-1:1, flipY?-1:1);
    ctx.rotate(deg*Math.PI/180);

    // 節流更新 filter：每 50ms 以內只重建一次
    if(ts-lastBuild>50){ buildFilter(); lastBuild=ts; }
    ctx.filter=filterStr;

    const sc=Math.max(cv.width/w, cv.height/h); // 無縮放（移除智慧變焦）
    const dw=w*sc, dh=h*sc;
    ctx.drawImage(video, -dw/2, -dh/2, dw, dh);
    ctx.filter='none';
    ctx.restore();
  }
  raf=requestAnimationFrame(loop);
}

/* ==== 錄影 ==== */
function toggleRec(){
  if(recording){
    recorder.stop(); recording=false; recDot.style.display='none';
    // 改回「紅圓」圖示
    iconRec.innerHTML='<circle cx="12" cy="12" r="6" fill="#ff2d2d" stroke="none"/>';
  }else{
    const s=cv.captureStream(30);
    recorder=new MediaRecorder(s,{mimeType:'video/webm;codecs=vp9'});
    chunks=[];
    recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    recorder.onstop=()=>{
      const blob=new Blob(chunks,{type:'video/webm'}), url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=`VID_${Date.now()}.webm`; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),6000);
      toastOnce('已儲存影片');
    };
    recorder.start(); recording=true; recDot.style.display='block';
    // 換成「停止方塊」
    iconRec.innerHTML='<rect x="8" y="8" width="8" height="8" fill="#e6e6e6" stroke="none" rx="1"/>';
  }
}

/* ==== 截圖 ==== */
function shot(){
  cv.toBlob(b=>{
    if(!b) return;
    const url=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=url; a.download=`IMG_${Date.now()}.png`; a.click();
    const img=document.createElement('img'); img.className='thumb'; img.src=url; thumbs.prepend(img);
    requestAnimationFrame(()=>img.classList.add('show'));
    setTimeout(()=>URL.revokeObjectURL(url),8000);
    toastOnce('已儲存截圖');
  },'image/png',0.95);
}

/* ==== 裝置 ==== */
async function listCams(){
  const ds=await navigator.mediaDevices.enumerateDevices();
  const cams=ds.filter(d=>d.kind==='videoinput');
  deviceSel.innerHTML=''; cams.forEach((c,i)=>{const o=document.createElement('option'); o.value=c.deviceId; o.text=c.label||`Camera ${i+1}`; deviceSel.appendChild(o);});
}
async function openCam(){
  stopCam();
  const id=deviceSel.value;
  const c={video:{deviceId:id?{exact:id}:undefined,width:{ideal:1280},height:{ideal:720}}};
  stream=await navigator.mediaDevices.getUserMedia(c);
  video=document.createElement('video'); video.srcObject=stream; video.playsInline=true; await video.play();
}
function stopCam(){
  if(recording) toggleRec();
  if(raf) cancelAnimationFrame(raf); raf=null;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video=null; recDot.style.display='none';
}

/* ==== 設定抽屜 ==== */
function openPanel(){ panel.classList.add('open'); mask.classList.add('show'); bSettings.classList.add('active'); }
function closePanel(){ panel.classList.remove('open'); mask.classList.remove('show'); bSettings.classList.remove('active'); }
bSettings.onclick=()=> panel.classList.contains('open') ? closePanel() : openPanel();
pClose.onclick=closePanel; mask.onclick=closePanel;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closePanel();
  if(e.code==='F9'){ e.preventDefault(); toggleRec(); }
  if(e.code==='F10'){ e.preventDefault(); shot(); }
  if(e.code==='F11'){ e.preventDefault(); rotate(-10); } // 依需求固定逆時針 10°
});

/* 左側工具 */
tRotateL.onclick =()=>rotate(-10);
tRotateR.onclick =()=>rotate(+10);
tFlipX.onclick   =()=>{ flipX=!flipX; tFlipX.classList.toggle('active',flipX); };
tFlipY.onclick   =()=>{ flipY=!flipY; tFlipY.classList.toggle('active',flipY); };
tReset.onclick   =resetAll;
rotSlider.oninput=e=>setRotate(e.target.value);

/* ==== 預設（localStorage） ==== */
const KEYS={1:'preset_v1',2:'preset_v2',3:'preset_v3'};
function readPreset(slot){
  const txt=localStorage.getItem(KEYS[slot]); if(!txt) return null;
  try{return JSON.parse(txt);}catch{return null;}
}
function applyPreset(p){
  if(!p) return;
  sBright.value=p.bright; sContrast.value=p.contrast; sSat.value=p.sat; sSharp.value=p.sharp; sGamma.value=p.gamma;
  [sBright,sContrast,sSat,sSharp,sGamma].forEach(s=>s.oninput());
}
function savePreset(slot){
  const p={bright:+sBright.value,contrast:+sContrast.value,sat:+sSat.value,sharp:+sSharp.value,gamma:+sGamma.value};
  localStorage.setItem(KEYS[slot], JSON.stringify(p));
  toastOnce(`已儲存到 V${slot}`);
}
['p1','p2','p3'].forEach((id,idx)=>{
  document.getElementById(id).onclick=()=>{ const p=readPreset(idx+1); applyPreset(p); };
});
document.querySelectorAll('[data-save]').forEach(btn=>{
  btn.onclick=()=>savePreset(btn.dataset.save);
});

/* ==== 啟動 ==== */
(async()=>{
  try{ await navigator.mediaDevices.getUserMedia({video:true}); }catch(e){}
  await listCams(); if(deviceSel.options.length) await openCam();
  // 初始化數值文字
  [sBright,sContrast,sSat,sSharp,sGamma].forEach(s=>s.oninput());
  loop(0);
})();
btnFind.onclick=listCams; deviceSel.onchange=openCam;
bShot.onclick=shot; bRec.onclick=toggleRec;
</script>
</body>
</html>
