<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediCam – Web OEM (Vendor Layout)</title>
<meta name="description" content="Endoscope web viewer. Vendor-style layout.">
<style>
  :root{
    --bg:#000;--fg:#fff;--muted:#cfcfcf;--line:#3a3a3a;--accent:#ffffff;
    --btn:#0e0e0e;--btn-bd:#4a4a4a;--btn-hover:#1b1b1b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  .app{height:100%;display:grid;grid-template-rows:auto 1fr}
  /* ── Top Bar (像原廠) ───────────────────────────── */
  .top{
    display:grid;grid-template-columns:auto 1fr auto auto auto auto auto;
    gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);
    background:#000
  }
  .brand{font-weight:800;font-size:28px;letter-spacing:.5px}
  .label{color:#ccc}
  .pill, select, input[type="text"]{
    height:32px; padding:6px 10px; background:#111; color:#fff;
    border:1px solid var(--line); border-radius:4px; min-width:120px
  }
  .btn{height:32px;padding:6px 12px;border:1px solid var(--line);border-radius:4px;
    background:var(--btn);color:#fff;cursor:pointer}
  .btn:hover{background:var(--btn-hover)}
  .lang{min-width:110px}
  /* ── Main / Canvas only center ─────────────────── */
  .main{position:relative;display:grid;grid-template-columns:auto 1fr auto}
  .canvas-wrap{display:flex;align-items:center;justify-content:center}
  .canvas-box{width:min(88vh,86vw);height:min(88vh,86vw);max-width:1100px;max-height:1100px;
    background:#000; border:1px solid var(--line); position:relative; border-radius:6px}
  canvas{width:100%;height:100%;background:#000;border-radius:6px}
  /* ── Left Tool Strip (直立圖示) ─────────────────── */
  .leftbar{display:flex;flex-direction:column;gap:16px;padding:12px}
  .iconbtn{width:40px;height:40px;border:1px solid #fff;border-radius:4px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
  .iconbtn:hover{background:#111}
  .reset{font-size:12px;letter-spacing:.5px}
  .slider-wrap{display:flex;flex-direction:column;align-items:center;color:#ddd;margin-top:8px}
  .rot-val{font-size:12px;margin-top:6px}
  input[type="range"]{writing-mode:bt-lr;-webkit-appearance:slider-vertical;width:12px;height:220px}
  /* ── Bottom Big Buttons (相機/錄影) ─────────────── */
  .bottombar{
    position:absolute;left:50%;transform:translateX(-50%);bottom:-70px;
    display:flex;gap:28px;align-items:center
  }
  .big{width:84px;height:84px;border:3px solid #fff;border-radius:8px;display:flex;
    align-items:center;justify-content:center;background:transparent;cursor:pointer}
  .big:hover{background:#111}
  .icon{width:38px;height:38px;display:block;filter:invert(1)}
  .smallslot{width:110px;height:84px;border:2px dashed var(--line);border-radius:6px}
  .gear{position:absolute;right:-70px;bottom:-70px;width:58px;height:58px;border:2px solid #fff;
    border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  /* ── On-canvas status ──────────────────────────── */
  .rec-dot{position:absolute;right:14px;top:14px;width:14px;height:14px;border-radius:50%;background:#f00;display:none}
  .toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px;color:#fff;display:none}
</style>
</head>
<body>
<div class="app">
  <!-- Top bar -->
  <div class="top">
    <div class="brand">MediVisionTech</div>
    <div class="label" style="text-align:right;">Please select camera</div>
    <select id="deviceSelect" class="pill"></select>
    <button class="btn" id="btnFind">Find device</button>
    <div class="label">ID</div><input id="txtId" class="pill" type="text" style="width:90px">
    <div class="label">Name</div><input id="txtName" class="pill" type="text" style="width:140px">
    <select id="lang" class="pill lang">
      <option>English</option><option>繁體中文</option><option>日本語</option>
    </select>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Left tool bar -->
    <div class="leftbar">
      <div class="iconbtn" id="btnFull" title="Fullscreen">⤢</div>
      <div class="iconbtn" id="btnRotateL" title="Rotate -10°">↺</div>
      <div class="iconbtn" id="btnRotateR" title="Rotate +10°">↻</div>
      <div class="iconbtn" id="btnMirrorLR" title="Mirror LR">⇋</div>
      <div class="iconbtn" id="btnMirrorUD" title="Mirror UD">⇅</div>
      <div class="iconbtn reset" id="btnReset" title="Reset">RESET</div>

      <div class="slider-wrap">
        <input id="rotSlider" type="range" min="-180" max="180" value="0">
        <div class="rot-val" id="rotVal">Rotation 0°</div>
      </div>
    </div>

    <!-- Center canvas -->
    <div class="canvas-wrap">
      <div class="canvas-box" id="box">
        <canvas id="canvas" width="624" height="624"></canvas>
        <div class="rec-dot" id="recDot"></div>
        <div class="toast" id="toast">Saved</div>

        <!-- bottom big buttons -->
        <div class="bottombar">
          <button class="big" id="btnShot" title="Snapshot (F10)">
            <!-- 相機圖示（純 CSS 替代，可後續換 SVG） -->
            <span style="font-size:28px">📷</span>
          </button>
          <div class="smallslot" title="Last shot"></div>
          <button class="big" id="btnRec" title="Record (F9)"><span style="font-size:28px">🎥</span></button>
          <div class="big" id="btnSaveRec" title="Stop & Save">
            <span style="font-size:12px;letter-spacing:1px">VIDEO</span>
          </div>
        </div>

        <div class="gear" id="btnGear" title="Settings">⚙</div>
      </div>
    </div>

    <!-- right empty spacer to保持置中 -->
    <div></div>
  </div>
</div>

<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const deviceSelect=document.getElementById('deviceSelect');
const btnFind=document.getElementById('btnFind');
const btnFull=document.getElementById('btnFull');
const btnRotateL=document.getElementById('btnRotateL');
const btnRotateR=document.getElementById('btnRotateR');
const btnMirrorLR=document.getElementById('btnMirrorLR');
const btnMirrorUD=document.getElementById('btnMirrorUD');
const btnReset=document.getElementById('btnReset');
const rotSlider=document.getElementById('rotSlider');
const rotVal=document.getElementById('rotVal');
const btnShot=document.getElementById('btnShot');
const btnRec=document.getElementById('btnRec');
const btnSaveRec=document.getElementById('btnSaveRec');
const recDot=document.getElementById('recDot');
const toast=document.getElementById('toast');
const box=document.getElementById('box');

let stream=null, video=null, raf=null;
let mirrorLR=false, mirrorUD=false, deg=0, zoom=1.0;
let recorder=null, chunks=[], recBlink=null, recording=false;

function toastOnce(msg='Saved'){
  toast.textContent=msg; toast.style.display='block';
  setTimeout(()=>toast.style.display='none',900);
}
function fpsLoop(){
  if(!video) return;
  const w=video.videoWidth, h=video.videoHeight;
  if(w&&h){
    ctx.save(); ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.scale(mirrorLR?-1:1, mirrorUD?-1:1);
    ctx.rotate(deg*Math.PI/180);
    const vw=canvas.width, vh=canvas.height;
    const scale=Math.max(vw/w, vh/h)*zoom, dw=w*scale, dh=h*scale;
    ctx.drawImage(video, -dw/2, -dh/2, dw, dh);
    if(recording && recDot){
      recDot.style.display = recDot.style.display==='none' ? 'block':'none';
    }
    ctx.restore();
  }
  raf=requestAnimationFrame(fpsLoop);
}

async function refreshDevices(){
  const devices=await navigator.mediaDevices.enumerateDevices();
  const cams=devices.filter(d=>d.kind==='videoinput');
  deviceSelect.innerHTML='';
  cams.forEach((c,i)=>{
    const o=document.createElement('option'); o.value=c.deviceId; o.text=c.label||`Camera ${i+1}`; deviceSelect.appendChild(o);
  });
}

async function openSelected(){
  stopAll();
  const id=deviceSelect.value;
  const constraints={video:{deviceId:id?{exact:id}:undefined, width:{ideal:1280}, height:{ideal:720}}};
  stream=await navigator.mediaDevices.getUserMedia(constraints);
  video=document.createElement('video'); video.srcObject=stream; video.playsInline=true; await video.play();
  raf=requestAnimationFrame(fpsLoop);
}

function stopAll(){
  if(recorder && recording){ stopAndSave(); }
  if(raf) cancelAnimationFrame(raf); raf=null;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video=null; recDot.style.display='none';
}

function rotate(d){ deg=(deg+d+360)%360; rotSlider.value=deg; rotVal.textContent=`Rotation ${deg}°`; }
function setRotate(v){ deg=Number(v); rotVal.textContent=`Rotation ${deg}°`; }
function resetView(){ mirrorLR=false; mirrorUD=false; setRotate(0); zoom=1.0; }

function snapshot(){
  canvas.toBlob(b=>{
    const url=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=url; a.download=`IMG_${Date.now()}.png`; a.click();
    URL.revokeObjectURL(url);
    toastOnce('Screenshot saved');
  },'image/png',0.95);
}

function startRec(){
  if(recording) return;
  const s=canvas.captureStream(30);
  recorder=new MediaRecorder(s,{mimeType:'video/webm;codecs=vp9'});
  chunks=[];
  recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`VID_${Date.now()}.webm`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  };
  recorder.start(); recording=true; recDot.style.display='block'; toastOnce('Recording… (F9 停止)');
}
function stopAndSave(){
  if(!recording) return;
  recorder.stop(); recording=false; recDot.style.display='none'; toastOnce('Video saved');
}

document.addEventListener('keydown',e=>{
  if(e.code==='F9'){ e.preventDefault(); recording?stopAndSave():startRec(); }
  if(e.code==='F10'){ e.preventDefault(); snapshot(); }
  if(e.code==='F11'){ e.preventDefault(); rotate(-10); }
});
btnFind.onclick=refreshDevices;
deviceSelect.onchange=openSelected;

btnFull.onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else box.requestFullscreen(); };
btnRotateL.onclick=()=>rotate(-10);
btnRotateR.onclick=()=>rotate(+10);
btnMirrorLR.onclick=()=>{ mirrorLR=!mirrorLR; };
btnMirrorUD.onclick=()=>{ mirrorUD=!mirrorUD; };
btnReset.onclick=resetView;
rotSlider.oninput=e=>setRotate(e.target.value);
btnShot.onclick=snapshot;
btnRec.onclick=()=>recording?stopAndSave():startRec();
btnSaveRec.onclick=stopAndSave;

(async()=>{
  try{ await navigator.mediaDevices.getUserMedia({video:true}); }catch(e){}
  await refreshDevices();
  if(deviceSelect.options.length) openSelected();
})();
</script>
</body>
</html>
