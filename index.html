<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediCam – Web OEM (Vendor Layout)</title>
<meta name="description" content="Endoscope web viewer. Vendor-style layout.">
<style>
  :root{
    --bg:#000; --fg:#fff; --muted:#cfcfcf; --line:#2c2c2c;
    --btn-bg:#d9d9d9; --btn-tx:#111; --btn-bd:#b7b7b7; --btn-bg-h:#ededed;
    --chip-bg:#111; --chip-tx:#fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; overflow:hidden}
  .app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:0}
  /* Top bar：更緊湊 */
  .top{
    display:grid;grid-template-columns:auto 1fr auto auto auto auto auto;
    gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:#000
  }
  .brand{font-weight:800;font-size:22px;letter-spacing:.3px}
  .label{color:#bdbdbd;font-size:13px;text-align:right}
  .pill, select, input[type="text"]{
    height:28px; padding:4px 8px; background:var(--chip-bg); color:var(--chip-tx);
    border:1px solid var(--line); border-radius:4px; min-width:120px; font-size:13px
  }
  .lang{min-width:110px}
  .btn{
    height:28px; padding:4px 10px; border:1px solid var(--btn-bd); border-radius:6px;
    background:var(--btn-bg); color:var(--btn-tx); cursor:pointer; font-size:13px
  }
  .btn:hover{background:var(--btn-bg-h)}
  /* 主區：三欄，左工具列更窄、canvas 置中 */
  .main{position:relative;display:grid;grid-template-columns:56px 1fr 56px;height:100%}
  .leftbar{display:flex;flex-direction:column;gap:10px;padding:10px}
  .iconbtn{
    width:36px;height:36px;border:1px solid #fff;border-radius:4px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;
    background:transparent;font-size:18px;line-height:1
  }
  .iconbtn:hover{background:#111}
  .slider-wrap{display:flex;flex-direction:column;align-items:center;color:#ddd;margin-top:6px}
  .rot-val{font-size:11px;margin-top:4px}
  input[type="range"]{writing-mode:bt-lr;-webkit-appearance:slider-vertical;width:10px;height:170px}
  .canvas-wrap{display:flex;align-items:center;justify-content:center}
  .canvas-box{
    width:min(84vh,82vw); height:min(84vh,82vw); max-width:1000px; max-height:1000px;
    background:#000; border:1px solid var(--line); border-radius:6px; position:relative
  }
  canvas{width:100%;height:100%;background:#000;border-radius:6px}
  /* 底部按鈕：更緊湊，移到畫面內底邊，不需要捲動 */
  .bbar{
    position:absolute;left:50%;transform:translateX(-50%);bottom:8px;
    display:flex;gap:14px;align-items:center
  }
  .big{
    width:64px;height:64px;border:2px solid #fff;border-radius:8px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent
  }
  .big:hover{background:#111}
  .thumb{
    width:86px;height:64px;border:1px solid #fff;border-radius:6px;object-fit:contain;background:#0a0a0a
  }
  .gear{
    position:absolute;right:8px;bottom:8px;width:44px;height:44px;border:2px solid #fff;
    border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent
  }
  .rec-dot{position:absolute;right:10px;top:10px;width:12px;height:12px;border-radius:50%;background:#f00;display:none}
  .toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);
    background:rgba(0,0,0,.6);padding:5px 9px;border-radius:8px;color:#fff;display:none;font-size:12px}
  /* 設定面板（右側滑出） */
  .panel{
    position:fixed;top:0;right:-360px;width:360px;height:100%;background:#0c0c0c;
    border-left:1px solid var(--line);transition:right .25s ease;z-index:50;padding:14px;color:#fff
  }
  .panel.open{right:0}
  .panel h3{margin:0 0 10px 0;font-size:16px}
  .p-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
  .p-row > *{font-size:13px}
  .close{position:absolute;right:12px;top:10px;cursor:pointer;font-size:18px}
</style>
</head>
<body>
<div class="app">
  <!-- Top bar -->
  <div class="top">
    <div class="brand" data-i18n="brand">MediVisionTech</div>
    <div class="label" data-i18n="selectCam" style="text-align:right;">Please select camera</div>
    <select id="deviceSelect" class="pill"></select>
    <button class="btn" id="btnFind" data-i18n="find">Find device</button>
    <div class="label" style="text-align:right;">ID</div>
    <input id="txtId" class="pill" type="text" style="width:80px">
    <div class="label" data-i18n="name">Name</div>
    <input id="txtName" class="pill" type="text" style="width:130px">
    <select id="lang" class="pill lang" title="Language">
      <option value="en">English</option>
      <option value="zh">繁體中文</option>
    </select>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Left toolbar -->
    <div class="leftbar">
      <button class="iconbtn" id="btnFull" title="Fullscreen">⤢</button>
      <button class="iconbtn" id="btnRotateL" title="Rotate -10°">↺</button>
      <button class="iconbtn" id="btnRotateR" title="Rotate +10°">↻</button>
      <button class="iconbtn" id="btnMirrorLR" title="Mirror LR">⇋</button>
      <button class="iconbtn" id="btnMirrorUD" title="Mirror UD">⇅</button>
      <button class="iconbtn" id="btnReset" title="Reset" style="font-size:12px">RESET</button>

      <div class="slider-wrap">
        <input id="rotSlider" type="range" min="-180" max="180" value="0">
        <div class="rot-val" id="rotVal">Rotation 0°</div>
      </div>
    </div>

    <!-- Center canvas -->
    <div class="canvas-wrap">
      <div class="canvas-box" id="box">
        <canvas id="canvas" width="624" height="624"></canvas>
        <div class="rec-dot" id="recDot"></div>
        <div class="toast" id="toast">Saved</div>

        <!-- bottom buttons (inside canvas) -->
        <div class="bbar">
          <button class="big" id="btnShot" title="Snapshot (F10)"><span style="font-size:24px">📷</span></button>
          <img id="thumb" class="thumb" alt="">
          <button class="big" id="btnRec" title="Record (F9)"><span style="font-size:24px">🎥</span></button>
          <button class="big" id="btnSaveRec" title="Stop & Save"><span style="font-size:11px;letter-spacing:1px">VIDEO</span></button>
        </div>

        <button class="gear" id="btnGear" title="Settings">⚙</button>
      </div>
    </div>

    <div></div>
  </div>
</div>

<!-- 設定面板 -->
<div class="panel" id="panel">
  <div class="close" id="pClose">✕</div>
  <h3 data-i18n="settings">Settings</h3>
  <div class="p-row">
    <span data-i18n="autoEnh">Auto enhancement (close-up)</span>
    <label><input type="checkbox" id="pEnh" checked></label>
  </div>
  <div class="p-row">
    <span data-i18n="rotStep">Rotate step (F11)</span>
    <select id="pStep">
      <option value="-10">-10°</option>
      <option value="-15">-15°</option>
      <option value="-5">-5°</option>
    </select>
  </div>
  <div class="p-row">
    <span data-i18n="zoom">Zoom</span>
    <input type="range" id="pZoom" min="100" max="300" value="130" style="width:160px">
    <span id="pZoomVal">1.30x</span>
  </div>
  <hr style="border-color:#222">
  <div class="p-row">
    <span>Gamma</span><input type="range" id="pGamma" min="80" max="180" value="130" style="width:180px">
  </div>
  <div class="p-row">
    <span data-i18n="sharp">Sharpen</span><input type="range" id="pSharp" min="0" max="100" value="60" style="width:180px">
  </div>
  <div class="p-row">
    <span data-i18n="saturation">Saturation</span><input type="range" id="pSat" min="-30" max="30" value="8" style="width:180px">
  </div>
  <div class="p-row">
    <span data-i18n="denoise">Denoise</span><input type="range" id="pDn" min="0" max="30" value="6" style="width:180px">
  </div>
</div>

<script>
/* ====== 基本元素 ====== */
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const deviceSelect=document.getElementById('deviceSelect'), btnFind=document.getElementById('btnFind');
const btnFull=document.getElementById('btnFull'), btnRotateL=document.getElementById('btnRotateL'), btnRotateR=document.getElementById('btnRotateR');
const btnMirrorLR=document.getElementById('btnMirrorLR'), btnMirrorUD=document.getElementById('btnMirrorUD'), btnReset=document.getElementById('btnReset');
const rotSlider=document.getElementById('rotSlider'), rotVal=document.getElementById('rotVal');
const btnShot=document.getElementById('btnShot'), btnRec=document.getElementById('btnRec'), btnSaveRec=document.getElementById('btnSaveRec'), thumb=document.getElementById('thumb');
const recDot=document.getElementById('recDot'), toast=document.getElementById('toast'), box=document.getElementById('box');
const langSel=document.getElementById('lang');
/* 設定面板 */
const panel=document.getElementById('panel'), pClose=document.getElementById('pClose'), btnGear=document.getElementById('btnGear');
const pEnh=document.getElementById('pEnh'), pStep=document.getElementById('pStep');
const pZoom=document.getElementById('pZoom'), pZoomVal=document.getElementById('pZoomVal');
const pGamma=document.getElementById('pGamma'), pSharp=document.getElementById('pSharp'), pSat=document.getElementById('pSat'), pDn=document.getElementById('pDn');

/* 狀態 */
let stream=null, video=null, raf=null;
let mirrorLR=false, mirrorUD=false, deg=0, zoom=1.3;
let recorder=null, chunks=[], recording=false;
let step=-10; // F11 旋轉步進
let lastEnhFrame=0;

/* ====== i18n（中/英） ====== */
const dict={
  en:{
    brand:'MediVisionTech', selectCam:'Please select camera', find:'Find device', name:'Name',
    settings:'Settings', autoEnh:'Auto enhancement (close-up)', rotStep:'Rotate step (F11)',
    zoom:'Zoom', sharp:'Sharpen', saturation:'Saturation', denoise:'Denoise',
    saved:'Saved', recStart:'Recording… (Press F9 to stop)', recSaved:'Video saved'
  },
  zh:{
    brand:'MediVisionTech', selectCam:'選擇鏡頭', find:'搜尋裝置', name:'姓名',
    settings:'設定', autoEnh:'自動畫質調校（近距）', rotStep:'旋轉步進（F11）',
    zoom:'變焦', sharp:'銳利度', saturation:'飽和度', denoise:'降噪',
    saved:'已儲存', recStart:'錄影中…（按 F9 停止）', recSaved:'已儲存影片'
  }
};
function applyLang(code){
  const t=dict[code]||dict.en;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n'); if(t[key]) el.textContent=t[key];
  });
  toast.textContent=t.saved;
}
langSel.onchange=()=>applyLang(langSel.value);

/* ====== UI 小工具 ====== */
function toastOnce(msg){
  toast.textContent=msg; toast.style.display='block';
  setTimeout(()=>toast.style.display='none',900);
}
function rotate(d){ setRotate(deg + d); }
function setRotate(v){ deg=(Number(v)%360+360)%360; rotSlider.value=deg; rotVal.textContent=`Rotation ${deg}°`; }
function resetView(){ mirrorLR=false; mirrorUD=false; setRotate(0); zoom=1.3; pZoom.value=130; pZoomVal.textContent='1.30x'; }
function setZoom(v){ zoom=Math.max(1,Math.min(3,v)); pZoom.value=Math.round(zoom*100); pZoomVal.textContent=zoom.toFixed(2)+'x'; }

/* ====== 視訊渲染 ====== */
function render(){
  if(!video){ raf=requestAnimationFrame(render); return; }
  const w=video.videoWidth,h=video.videoHeight;
  if(w&&h){
    ctx.save(); ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.scale(mirrorLR?-1:1, mirrorUD?-1:1);
    ctx.rotate(deg*Math.PI/180);
    const vw=canvas.width, vh=canvas.height;
    const sc=Math.max(vw/w, vh/h)*zoom, dw=w*sc, dh=h*sc;

    if(pEnh.checked){
      // 簡單的近距強化（對比/飽和/亮度），每 2 frame 更新一次濾鏡字串
      const now=performance.now();
      if(now-lastEnhFrame>60){
        const gamma=parseInt(pGamma.value)/100.0;
        const bright=(gamma>=1?1+(gamma-1)*0.8:1-(1-gamma)*0.5);
        const contrast=1.1+(parseInt(pSharp.value)/100)*0.5;
        const sat=1.0+(parseInt(pSat.value)/100);
        const blur=Math.max(0, 6-parseInt(pDn.value)/6);
        ctx.filter=`contrast(${contrast}) saturate(${sat}) brightness(${bright}) blur(${blur}px)`;
        lastEnhFrame=now;
      }
    }else{
      ctx.filter='none';
    }

    ctx.drawImage(video, -dw/2, -dh/2, dw, dh);
    ctx.filter='none';
    ctx.restore();
  }
  raf=requestAnimationFrame(render);
}

/* ====== 錄影 ====== */
function startRec(){
  if(recording) return;
  const s=canvas.captureStream(30);
  recorder=new MediaRecorder(s,{mimeType:'video/webm;codecs=vp9'});
  chunks=[];
  recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'}), url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`VID_${Date.now()}.webm`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toastOnce(dict[langSel.value]?.recSaved || dict.en.recSaved);
  };
  recorder.start(); recording=true; recDot.style.display='block';
  toastOnce(dict[langSel.value]?.recStart || dict.en.recStart);
}
function stopAndSave(){ if(!recording) return; recorder.stop(); recording=false; recDot.style.display='none'; }

/* ====== 截圖 ====== */
function snapshot(){
  canvas.toBlob(b=>{
    if(!b) return;
    const url=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=url; a.download=`IMG_${Date.now()}.png`; a.click();
    thumb.src=url; // 顯示縮圖
    toastOnce(dict[langSel.value]?.saved || dict.en.saved);
    setTimeout(()=>URL.revokeObjectURL(url),8000);
  },'image/png',0.95);
}

/* ====== 相機 ====== */
async function refreshDevices(){
  const devs=await navigator.mediaDevices.enumerateDevices();
  const cams=devs.filter(d=>d.kind==='videoinput');
  deviceSelect.innerHTML=''; cams.forEach((c,i)=>{ const o=document.createElement('option'); o.value=c.deviceId; o.text=c.label||`Camera ${i+1}`; deviceSelect.appendChild(o); });
}
async function openSelected(){
  stopAll();
  const id=deviceSelect.value;
  const c={video:{deviceId:id?{exact:id}:undefined, width:{ideal:1280}, height:{ideal:720}}};
  stream=await navigator.mediaDevices.getUserMedia(c);
  video=document.createElement('video'); video.srcObject=stream; video.playsInline=true; await video.play();
}
function stopAll(){
  if(recording) stopAndSave();
  if(raf) cancelAnimationFrame(raf); raf=null;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video=null; recDot.style.display='none';
}

/* ====== 事件 ====== */
btnFind.onclick=refreshDevices;
deviceSelect.onchange=async()=>{ await openSelected(); };
btnFull.onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else box.requestFullscreen(); };
btnRotateL.onclick=()=>rotate(-10);
btnRotateR.onclick=()=>rotate(+10);
btnMirrorLR.onclick=()=>{ mirrorLR=!mirrorLR; };
btnMirrorUD.onclick=()=>{ mirrorUD=!mirrorUD; };
btnReset.onclick=resetView;
rotSlider.oninput=e=>setRotate(e.target.value);
btnShot.onclick=snapshot;
btnRec.onclick=()=>recording?stopAndSave():startRec();
btnSaveRec.onclick=stopAndSave;

/* 設定面板開關與控制 */
btnGear.onclick=()=>panel.classList.add('open');
pClose.onclick=()=>panel.classList.remove('open');
pStep.onchange=()=>{ step=parseInt(pStep.value)||-10; };
pZoom.oninput=e=>setZoom(parseInt(e.target.value)/100);

/* 快捷鍵：F9/F10/F11、+/- 變焦 */
document.addEventListener('keydown',e=>{
  if(e.code==='F9'){ e.preventDefault(); recording?stopAndSave():startRec(); }
  else if(e.code==='F10'){ e.preventDefault(); snapshot(); }
  else if(e.code==='F11'){ e.preventDefault(); rotate(step); }
  else if(e.key==='+'){ setZoom(zoom+0.1); }
  else if(e.key==='-'){ setZoom(zoom-0.1); }
});

/* 啟動：要求權限 → 列攝影機 → 開第一支 → 套語言 → 渲染 */
(async()=>{
  try{ await navigator.mediaDevices.getUserMedia({video:true}); }catch(e){}
  await refreshDevices();
  if(deviceSelect.options.length){ await openSelected(); }
  applyLang('zh'); // 預設中文
  setZoom(1.3);
  render();
})();
</script>
</body>
</html>
