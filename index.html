<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCam Interface</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* --- 1. 全局和基礎設定 (暗黑主題) --- */
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #2b2b2b; /* 截圖中的深灰色背景 */
            color: #ffffff; /* 預設文字為白色 */
            overflow: hidden; /* 防止滾動，保持介面固定 */
        }

        /* 自訂所有控制項的通用樣式 */
        input[type="text"], select, button {
            background-color: #555;
            color: #fff;
            border: 1px solid #777;
            border-radius: 3px;
            padding: 5px 8px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
            background-color: #666;
        }
        button:hover {
            background-color: #777;
        }

        /* --- 2. 應用程式主容器 (Flexbox 垂直佈局) --- */
        .app-container {
            display: flex;
            flex-direction: column; /* 垂直排列：頁首 + 主內容 */
            height: 100vh; /* 佔滿整個視窗高度 */
        }

        /* --- 3. 頁首 (app-header) --- */
        .app-header {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background-color: #222; /* 頁首背景色 */
            border-bottom: 1px solid #444;
            flex-shrink: 0; /* 頁首高度不壓縮 */
        }
        .app-header .logo {
            font-size: 20px;
            font-weight: bold;
            margin-right: 20px;
        }
        .app-header .controls {
            display: flex;
            align-items: center;
            gap: 10px; /* 元素間距 */
        }
        .app-header .spacer {
            flex-grow: 1; /* 這是一個彈性空間，會把右側元素推到最右邊 */
        }

        /* --- 4. 主內容區 (CSS Grid 網格佈局) --- */
        /* 這就是解決「亂跳」的關鍵！ */
        .main-content {
            flex-grow: 1; /* 佔滿頁首以外的所有剩餘空間 */
            display: grid;
            /* 定義三欄：左側欄(auto), 中央(1fr), 右側欄(auto) */
            grid-template-columns: auto 1fr auto; 
            padding: 15px;
            gap: 15px; /* 欄位間的空隙 */
            overflow: hidden; /* 內部內容超出時隱藏 */
        }

        /* --- 5. 左側欄 (left-sidebar) --- */
        .left-sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .left-sidebar .icon-button {
            font-size: 20px;
            width: 40px;
            height: 40px;
            background-color: #333;
            border: 1px solid #555;
        }
        .left-sidebar .vertical-slider-container {
            flex-grow: 1; /* 佔滿剩餘垂直空間 */
            display: flex;
            flex-direction: column;
            align-items: center;
            writing-mode: vertical-rl; /* 讓文字和滑桿垂直 */
            gap: 10px;
            margin: 10px 0;
        }
        .left-sidebar input[type="range"][orient="vertical"] {
            width: 20px; /* 垂直滑桿的寬度 */
            flex-grow: 1;
            /* 讓滑桿垂直 */
            -webkit-appearance: slider-vertical;
            writing-mode: bt-lr; /* Chrome/Safari */
        }

        /* --- 6. 中央面板 (center-panel) --- */
        .center-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0; /* 防止 Grid 佈局溢出 */
        }
        .video-container {
            flex-grow: 1; /* 佔滿所有可用垂直空間 */
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 5px;
        }
        /* 您的攝影機影像會顯示在這裡 */
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 填滿容器，可能會裁切 */
        }
        .video-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; /* 高度不壓縮 */
        }
        .video-controls .main-actions {
            display: flex;
            gap: 10px;
        }
        .video-controls .action-button {
            width: 80px;
            height: 60px;
            background-color: #333;
            border: 1px solid #555;
            font-size: 24px;
        }
        .video-controls .arrow-button {
            width: 60px;
            height: 60px;
            font-size: 24px;
        }

        /* --- 7. 右側欄 (right-sidebar) --- */
        .right-sidebar {
            width: 300px; /* 固定寬度 */
            background-color: #333;
            border-radius: 5px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto; /* 如果內容太多，允許內部滾動 */
        }
        .control-group h3 {
            margin: 0 0 15px 0;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }
        .slider-control {
            display: grid;
            grid-template-columns: 80px 1fr 50px; /* 標籤 | 滑桿 | 數值 */
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .slider-control input[type="range"] {
            width: 100%;
            margin: 0;
        }
        .parameter-management .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .parameter-management .actions button {
            flex-grow: 1; /* 讓按鈕平分寬度 */
        }
        .parameter-list {
            background-color: #222;
            border: 1px solid #555;
            height: 100px;
            margin-top: 10px;
            padding: 10px;
            overflow-y: auto;
            border-radius: 3px;
        }

    </style>
</head>
<body>

    <div class="app-container">

        <header class="app-header">
            <div class="logo">MediVisionTech</div>
            <div class="controls">
                <label for="camera-select">Please select camera</label>
                <select id="camera-select">
                    <option>PC Camera</option>
                    </select>
                <button id="find-device">Find device</button>
                <label for="id-input">ID</label>
                <input type="text" id="id-input" size="10">
                <label for="name-input">Name</label>
                <input type="text" id="name-input" size="15">
            </div>
            <div class="spacer"></div> <div class="controls">
                <label for="lang-select">Language</label>
                <select id="lang-select">
                    <option>English</option>
                    <option>繁體中文</option>
                </select>
            </div>
        </header>

        <main class="main-content">

            <aside class="left-sidebar">
                <button class="icon-button"><i class="fas fa-expand"></i></button>
                <button class="icon-button"><i class="fas fa-undo"></i></button>
                <button class="icon-button"><i class="fas fa-redo"></i></button>
                <button class="icon-button"><i class="fas fa-exclamation-triangle"></i></button>
                <button class="icon-button"><i class="fas fa-play"></i></button>
                <button class="icon-button">RESET</button>
                
                <div class="vertical-slider-container">
                    <span>Rotation degree</span>
                    <input type="range" min="0" max="360" value="5" orient="vertical">
                    <span>5</span>
                </div>
            </aside>

            <section class="center-panel">
                <div class="video-container">
                    <video id="endoscope-video" autoplay playsinline></video>
                </div>
                <div class="video-controls">
                    <div class="main-actions">
                        <button class="action-button" id="snapshot-btn">
                            <i class="fas fa-camera"></i>
                        </button>
                        <button class="action-button" id="record-btn">
                            <i class="fas fa-video"></i>
                        </button>
                        <button class="action-button" id="folder-btn">
                            <i class="fas fa-folder"></i>
                        </button>
                    </div>
                    <button class="arrow-button"><i class="fas fa-chevron-right"></i></button>
                </div>
            </section>

            <aside class="right-sidebar">
                <div class="control-group image-parameters">
                    <h3>Image Parameter Control</h3>
                    <div class="slider-control">
                        <label for="brightness">Brightness:</label>
                        <input type="range" id="brightness" min="0" max="100" value="30">
                        <span>30.00</span>
                    </div>
                    <div class="slider-control">
                        <label for="contrast">Contrast:</label>
                        <input type="range" id="contrast" min="0" max="100" value="0">
                        <span>0.00</span>
                    </div>
                    <div class="slider-control">
                        <label for="saturation">Saturation:</label>
                        <input type="range" id="saturation" min="0" max="100" value="30">
                        <span>30.00</span>
                    </div>
                    <div class="slider-control">
                        <label for="sharpness">Sharpness:</label>
                        <input type="range" id="sharpness" min="0" max="100" value="5">
                        <span>5.00</span>
                    </div>
                    <div class="slider-control">
                        <label for="gamma">Gamma:</label>
                        <input type="range" id="gamma" min="0" max="200" value="120">
                        <span>120.00</span>
                    </div>
                    <button id="reset-params" style="width: 100%;">Reset</button>
                </div>

                <div class="control-group parameter-management">
                    <h3>Parameter Management</h3>
                    <input type="text" id="param-name" placeholder="Enter parameter" style="width: 93%;">
                    <div class="actions">
                        <button id="save-param">Save</button>
                        <button id="delete-param">Delete</button>
                        <button id="rename-param">Rename</button>
                    </div>
                    <div class="parameter-list">
                        <div>333</div>
                        <div>888</div>
                    </div>
                </div>
            </aside>

        </main>
    </div>

    <script>
        // 例如：
        // const videoElement = document.getElementById('endoscope-video');
        // const snapshotBtn = document.getElementById('snapshot-btn');
        //
        // ... 您所有的內視鏡邏輯 ...
        //
        // snapshotBtn.addEventListener('click', () => {
        //    ... 執行拍照 ...
        // });

        // 這裡是一個範例，讓滑桿能即時更新數值
        document.querySelectorAll('.slider-control input[type="range"]').forEach(slider => {
            slider.addEventListener('input', (e) => {
                const valueSpan = e.target.nextElementSibling;
                if (valueSpan) {
                    valueSpan.textContent = parseFloat(e.target.value).toFixed(2);
                }
            });
        });

    </script>

</body>
</html>
