<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediVisionTech • Web Viewer</title>
<style>
:root{
  --bg:#0b0b0b; --panel:#121212; --line:#2a2a2a; --txt:#eaeaea;
  --accent:#6ee86b; --muted:#9aa0a6; --danger:#ff4d4d;
  --btn-bg:#1e1e1e; --btn-border:#2e2e2e; --chip:#232323;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}
.app{display:grid;grid-template-rows:56px 1fr;grid-template-columns:260px 1fr 360px;grid-template-areas:
  "top top top" "left center right";height:100%;gap:0}
.top{grid-area:top;display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.5px}
.select, .btn{background:#111;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px}
.btn{cursor:pointer}
.left{grid-area:left;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 10px}
.tool{width:54px;height:54px;border:2px solid var(--btn-border);border-radius:12px;display:grid;place-items:center;background:var(--btn-bg);cursor:pointer;transition:.15s}
.tool:hover{border-color:#3a3a3a;transform:translateY(-1px)}
.sliderV{height:220px;margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.sliderV input{writing-mode:bt-lr;-webkit-appearance: slider-vertical;height:200px;width:8px}
.center{grid-area:center;display:grid;place-items:center;overflow:hidden}
.canvas-wrap{position:relative;width:min(78vmin,820px);aspect-ratio:1/1;border-radius:14px;background:#000;border:1px solid #1a1a1a;box-shadow:0 0 0 1px #0f0f0f inset}
canvas{width:100%;height:100%;display:block;border-radius:14px}
.rec-dot{position:absolute;right:10px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(255,77,77,.15);display:none}
#recText{position:absolute;right:34px;top:8px;font-weight:800;color:var(--danger);display:none;letter-spacing:1px}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.18}}
.rec-dot.blink{animation:blink .9s linear infinite}
#recText.blink{animation:blink .9s linear infinite}
.thumb-bar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:10px}
.thumb{width:70px;height:52px;border:2px solid #2b2b2b;border-radius:10px;background:#111;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.right{grid-area:right;border-left:1px solid var(--line);display:flex;flex-direction:column}
.section{padding:12px 14px;border-bottom:1px solid var(--line)}
.section h3{margin:4px 0 12px 0;font-size:14px;letter-spacing:.3px;color:#cfcfcf}
.row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:14px;margin:10px 0}
.row input[type="range"]{width:100%}
.preset-bar{display:flex;flex-wrap:wrap;gap:6px}
.preset-btn{background:var(--chip);border:1px solid #2b2b2b;border-radius:10px;padding:8px 10px;color:#ddd;cursor:pointer}
.preset-btn.active{outline:2px solid var(--accent);color:#fff}
.small{color:var(--muted);font-size:12px}
.actions{display:flex;flex-direction:column;gap:14px;padding:12px 14px}
.actionBtn{display:flex;gap:10px;align-items:center;justify-content:center;border:2px solid var(--btn-border);background:var(--btn-bg);border-radius:14px;height:64px;cursor:pointer}
.actionBtn:hover{border-color:#3a3a3a}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#1e1e1e;border:1px solid #333;padding:8px 12px;border-radius:10px;display:none}
.lang{min-width:220px}
.find{margin-left:auto}
.icon{width:24px;height:24px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">MediVisionTech</div>
    <select id="lang" class="select lang">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
    <div class="select" id="camSelWrap">
      <select id="camSel" class="select"></select>
    </div>
    <button class="btn find" id="btnFind">Find device</button>
    <button class="btn" id="btnSettings">Settings</button>
  </div>

  <!-- 左：工具列 -->
  <div class="left">
    <div class="tool" id="btnRotL" title="逆時針 10°">
      <svg class="icon" viewBox="0 0 24 24"><path fill="#e6e6e6" d="M7 7v4H3V3h8v4H7zm7 14a7 7 0 1 0-7-7h2a5 5 0 1 1 5 5v2Z"/></svg>
    </div>
    <div class="tool" id="btnRotR" title="順時針 10°">
      <svg class="icon" viewBox="0 0 24 24"><path fill="#e6e6e6" d="M17 7V3h-8v4h4v4h4V7zM10 21a7 7 0 1 0-7-7h2a5 5 0 1 1 5 5v2z"/></svg>
    </div>
    <div class="tool" id="btnFlipH" title="左右鏡像">
      <svg class="icon" viewBox="0 0 24 24"><path fill="#e6e6e6" d="M3 5h8v14H3zM13 5h8v14h-8z"/></svg>
    </div>
    <div class="tool" id="btnFlipV" title="上下鏡像">
      <svg class="icon" viewBox="0 0 24 24"><path fill="#e6e6e6" d="M5 3h14v8H5zM5 13h14v8H5z"/></svg>
    </div>
    <div class="tool" id="btnReset" title="重設影像">
      <svg class="icon" viewBox="0 0 24 24"><path fill="#e6e6e6" d="M12 6V3L8 7l4 4V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    </div>
    <div class="sliderV">
      <input id="rotSlider" type="range" min="-180" max="180" value="0" step="1">
      <div class="small">Rotation <span id="rotDeg">0°</span></div>
    </div>
  </div>

  <!-- 中：畫布 -->
  <div class="center">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="cv" width="624" height="624"></canvas>
      <div class="rec-dot" id="recDot"></div>
      <div id="recText">REC</div>
      <div class="toast" id="toast">Saved</div>
      <div class="thumb-bar" id="thumbBar"></div>
    </div>
  </div>

  <!-- 右：動作 + 設定 -->
  <div class="right">
    <div class="actions">
      <div class="actionBtn" id="btnShot">
        <svg class="icon" viewBox="0 0 24 24"><path fill="#e6e6e6" d="M20 5h-3.6l-1.2-2H8.8L7.6 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm-8 14a6 6 0 1 1 0-12 6 6 0 0 1 0 12Z"/></svg>
        <div>截圖</div>
      </div>
      <div class="actionBtn" id="btnRec">
        <svg class="icon" id="iconRec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="#ff2d2d"/></svg>
        <div>錄影 / 停止</div>
      </div>
      <div class="actionBtn" id="btnDrawer">
        <svg class="icon" viewBox="0 0 24 24"><path fill="#e6e6e6" d="M3 7h18v2H3V7m0 4h18v2H3v-2m0 4h18v2H3v-2Z"/></svg>
        <div>設定</div>
      </div>
    </div>

    <div class="section" id="drawer" style="display:none">
      <h3>設定 <span class="small" id="capInfo"></span></h3>

      <div class="row" style="grid-template-columns:130px auto;">
        <label>近拍模式（8mm）</label>
        <label style="display:flex;align-items:center;gap:10px;">
          <input id="chkMacro" type="checkbox">
          <span class="small">自動調光／Gamma／邊緣強化（防閃爍）</span>
        </label>
      </div>

      <div class="row"><label>亮度</label><input id="sBright" type="range" min="70" max="150" value="110"></div>
      <div class="row"><label>對比</label><input id="sContrast" type="range" min="80" max="160" value="120"></div>
      <div class="row"><label>飽和</label><input id="sSat" type="range" min="70" max="160" value="110"></div>
      <div class="row"><label>銳利</label><input id="sSharp" type="range" min="10" max="60"  value="30"></div>
      <div class="row"><label>Gamma</label><input id="sGamma" type="range" min="80" max="140" value="120"></div>

      <div class="row" style="grid-template-columns:130px 1fr;">
        <label>我的預設</label>
        <div id="presetList" class="preset-bar"></div>
      </div>
      <div class="row" style="grid-template-columns:130px 1fr;">
        <label>管理</label>
        <div class="preset-bar">
          <button class="preset-btn" id="btnAddPreset">新增預設</button>
          <button class="preset-btn" id="btnSaveOver">儲存到選中</button>
          <button class="preset-btn" id="btnRename">重新命名</button>
          <button class="preset-btn" id="btnDelete">刪除</button>
          <button class="preset-btn" id="btnResetAll">重置設定</button>
        </div>
      </div>
      <div class="small">預設保存在瀏覽器（localStorage）。</div>
    </div>
  </div>
</div>

<script>
/* ====== 基本變數 ====== */
const video = document.createElement('video'); video.playsInline = true; video.muted = true; video.autoplay = true;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d',{willReadFrequently:true});
const wrap=document.getElementById('canvasWrap');
const recDot=document.getElementById('recDot'), recText=document.getElementById('recText'), toastEl=document.getElementById('toast');
const btnDrawer=document.getElementById('btnDrawer'), drawer=document.getElementById('drawer');
const sBright=byId('sBright'), sContrast=byId('sContrast'), sSat=byId('sSat'), sSharp=byId('sSharp'), sGamma=byId('sGamma');
const rotSlider=byId('rotSlider'), rotDeg=byId('rotDeg');
const chkMacro=byId('chkMacro'); const capInfo=byId('capInfo');
const camSel=byId('camSel'); const langSel=byId('lang');
let stream=null, recording=false, recorder=null, chunks=[]; let t0=0;

/* ====== 初始化 ====== */
(async function init(){
  await refreshCams(); await openCam();
  enableNativeAutoControls();
  loop();
})();
byId('btnFind').onclick=()=>refreshCams();
byId('btnSettings').onclick=()=>toggleDrawer(true);
btnDrawer.onclick=()=>toggleDrawer();

/* ====== 攝像頭 ====== */
async function refreshCams(){
  const list = await navigator.mediaDevices.enumerateDevices();
  const cams = list.filter(d=>d.kind==='videoinput');
  camSel.innerHTML = cams.map((d,i)=>`<option value="${d.deviceId}">${d.label||'Camera '+(i+1)}</option>`).join('');
}
async function openCam(){
  try{
    stream && stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({video:{deviceId: camSel.value?{exact:camSel.value}:undefined, width:{ideal:1280}, height:{ideal:720}}, audio:false});
    video.srcObject = stream;
  }catch(e){ alert('開啟攝影機失敗：'+e.message); }
}
camSel.onchange=async()=>{ await openCam(); enableNativeAutoControls(); }

/* ====== 相機原生 AE/AF 能力（能用就開） ====== */
async function enableNativeAutoControls() {
  try {
    if (!stream) return;
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities?.() || {};
    const cons = {};
    if (caps.exposureMode && caps.exposureMode.includes('continuous')) {
      cons.advanced = [{ exposureMode: 'continuous' }];
    }
    if (caps.focusMode && caps.focusMode.includes('continuous')) {
      cons.advanced = [...(cons.advanced||[]), { focusMode: 'continuous' }];
    }
    if (Object.keys(cons).length) await track.applyConstraints(cons);
    const msg = [];
    if (cons.advanced?.some(x=>x.exposureMode==='continuous')) msg.push('AE');
    if (cons.advanced?.some(x=>x.focusMode==='continuous'))   msg.push('AF');
    capInfo.textContent = msg.length ? `原生已啟用：${msg.join(' / ')}` : '裝置無 AE/AF，使用軟體補償';
  } catch(e) {
    capInfo.textContent = '相機控制不支援，使用軟體補償';
  }
}

/* ====== 工具列 ====== */
let rot=0, flipH=1, flipV=1;
byId('btnRotL').onclick=()=>{rot-=10; rotSlider.value=rot; rotDeg.textContent=rot+'°';};
byId('btnRotR').onclick=()=>{rot+=10; rotSlider.value=rot; rotDeg.textContent=rot+'°';};
byId('btnFlipH').onclick=()=>{flipH*=-1};
byId('btnFlipV').onclick=()=>{flipV*=-1};
byId('btnReset').onclick=()=>{
  rot=0; flipH=1; flipV=1; rotSlider.value=0; rotDeg.textContent='0°';
  sBright.value=110; sContrast.value=120; sSat.value=110; sSharp.value=30; sGamma.value=120;
};
rotSlider.oninput=()=>{rot=+rotSlider.value; rotDeg.textContent=rot+'°'};

/* ====== 動作：截圖／錄影 ====== */
const thumbBar=byId('thumbBar');
byId('btnShot').onclick=()=>{
  const url=cv.toDataURL('image/png');
  const a=document.createElement('a'); a.href=url; a.download=`IMG_${Date.now()}.png`; a.click();
  addThumb(url); toastOnce('已儲存截圖');
};
let recBlinkTimer=null;
byId('btnRec').onclick=toggleRec;
function toggleRec(){
  if(recording){
    recorder.stop(); recording=false;
    clearInterval(recBlinkTimer); recBlinkTimer=null;
    recDot.style.display='none'; recDot.classList.remove('blink');
    recText.style.display='none'; recText.classList.remove('blink');
    byId('iconRec').innerHTML='<circle cx="12" cy="12" r="6" fill="#ff2d2d"/>';
  }else{
    const s=cv.captureStream(30);
    recorder=new MediaRecorder(s,{mimeType:'video/webm;codecs=vp9'});
    chunks=[];
    recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    recorder.onstop=()=>{
      const blob=new Blob(chunks,{type:'video/webm'}), url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=`VID_${Date.now()}.webm`; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),6000);
      toastOnce('已儲存影片');
    };
    recorder.start(); recording=true;
    byId('iconRec').innerHTML='<rect x="8" y="8" width="8" height="8" fill="#e6e6e6" rx="1"/>';
    recDot.style.display='block'; recText.style.display='block';
    recBlinkTimer = setInterval(()=>{
      recDot.classList.toggle('blink'); recText.classList.toggle('blink');
    }, 900);
  }
}
function addThumb(url){
  const box=document.createElement('div'); box.className='thumb';
  box.innerHTML=`<img src="${url}">`; thumbBar.prepend(box);
  while(thumbBar.children.length>4) thumbBar.lastChild.remove();
}
function toastOnce(msg){
  toastEl.textContent=msg; toastEl.style.display='block';
  setTimeout(()=>toastEl.style.display='none',1200);
}

/* ====== 設定抽屜 ====== */
function toggleDrawer(forceOpen){
  if(forceOpen===true){drawer.style.display='block';return}
  drawer.style.display = drawer.style.display==='none'?'block':'none';
}

/* ====== 近拍模式（不閃爍自動調光 + 邊緣強化） ====== */
let autoQEnabled=false, emaY=0.5;
const targetY=0.55, deadband=0.03, stepB=0.003, stepG=0.002;
const tmpCv=document.createElement('canvas'); tmpCv.width=64; tmpCv.height=64;
const tmpCtx=tmpCv.getContext('2d',{willReadFrequently:true});
chkMacro.onchange=()=>{ autoQEnabled=chkMacro.checked; };
function autoQualityTick(){
  if(!autoQEnabled || !video || !video.videoWidth) return;
  tmpCtx.drawImage(video,0,0,tmpCv.width,tmpCv.height);
  const d=tmpCtx.getImageData(0,0,tmpCv.width,tmpCv.height).data;
  let sum=0; for(let i=0;i<d.length;i+=4){ sum+=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255; }
  const mean=sum/(tmpCv.width*tmpCv.height); emaY=emaY*0.85+mean*0.15;
  const err=targetY-emaY;
  if(Math.abs(err)>deadband){
    const dir=Math.sign(err);
    let b=+sBright.value/100, g=+sGamma.value/100, c=+sContrast.value/100, sh=+sSharp.value/100;
    b=Math.min(1.50,Math.max(0.70,b+dir*stepB));
    g=Math.min(1.40,Math.max(0.80,g-dir*stepG)); // 亮時降gamma、暗時增gamma
    c=Math.min(1.60,Math.max(0.80,c+dir*stepB*0.8));
    sh=Math.min(0.60,Math.max(0.10,sh+dir*stepB*0.4));
    sBright.value=Math.round(b*100); sGamma.value=Math.round(g*100);
    sContrast.value=Math.round(c*100); sSharp.value=Math.round(sh*100);
  }
}

/* ====== 預設檔（可命名） ====== */
const PRESET_KEY='presets_named';
let presets=JSON.parse(localStorage.getItem(PRESET_KEY)||'[]'); // [{id,name,vals}]
const presetList=byId('presetList'); let selectedPresetId=null;
function readVals(){return{bright:+sBright.value,contrast:+sContrast.value,sat:+sSat.value,sharp:+sSharp.value,gamma:+sGamma.value}}
function writeVals(v){ if(!v) return; sBright.value=v.bright; sContrast.value=v.contrast; sSat.value=v.sat; sSharp.value=v.sharp; sGamma.value=v.gamma; }
function savePresets(){ localStorage.setItem(PRESET_KEY,JSON.stringify(presets)); }
function renderPresetChips(){
  presetList.innerHTML='';
  presets.forEach(p=>{
    const b=document.createElement('button');
    b.className='preset-btn'+(p.id===selectedPresetId?' active':''); b.textContent=p.name;
    b.onclick=()=>{selectedPresetId=p.id; writeVals(p.vals); renderPresetChips();}
    presetList.appendChild(b);
  });
}
byId('btnAddPreset').onclick=()=>{ const name=prompt('預設名稱：','我的預設'); if(!name) return; const id=Date.now(); presets.push({id,name,vals:readVals()}); selectedPresetId=id; savePresets(); renderPresetChips(); }
byId('btnSaveOver').onclick=()=>{ if(!selectedPresetId){alert('請先點選一個預設');return} const p=presets.find(x=>x.id===selectedPresetId); p.vals=readVals(); savePresets(); toastOnce('已儲存到選中預設'); }
byId('btnRename').onclick=()=>{ if(!selectedPresetId){alert('請先點選一個預設');return} const p=presets.find(x=>x.id===selectedPresetId); const name=prompt('新的名稱：',p.name); if(!name) return; p.name=name; savePresets(); renderPresetChips(); }
byId('btnDelete').onclick=()=>{ if(!selectedPresetId){alert('請先點選一個預設');return} presets=presets.filter(x=>x.id!==selectedPresetId); selectedPresetId=null; savePresets(); renderPresetChips(); }
byId('btnResetAll').onclick=()=>{ sBright.value=110; sContrast.value=120; sSat.value=110; sSharp.value=30; sGamma.value=120; }
renderPresetChips();

/* ====== 渲染回圈 ====== */
function loop(ts=0){
  requestAnimationFrame(loop);
  if(!video.videoWidth) return;
  const W=cv.width,H=cv.height; ctx.save();
  ctx.clearRect(0,0,W,H); ctx.translate(W/2,H/2); ctx.scale(flipH,flipV); ctx.rotate(rot*Math.PI/180);
  const w=video.videoWidth, h=video.videoHeight;
  // 置中等比裁切填滿到方形
  const s=Math.max(W/w, H/h); const dw=w*s, dh=h*s;
  ctx.drawImage(video,-dw/2,-dh/2,dw,dh);
  ctx.restore();

  // 影像調整（依 UI 值，輕度處理）
  const img=ctx.getImageData(0,0,W,H), data=img.data;
  const b=+sBright.value/100, c=+sContrast.value/100, sat=+sSat.value/100, sh=+sSharp.value/100, g=+sGamma.value/100;
  // LUT 預先
  const lutBright = 255*(b-1);
  for(let i=0;i<data.length;i+=4){
    let r=data[i],g1=data[i+1],b1=data[i+2];
    // gamma
    r=255*Math.pow((r/255), (1/(g)));
    g1=255*Math.pow((g1/255),(1/(g)));
    b1=255*Math.pow((b1/255),(1/(g)));
    // brightness + contrast
    r=((r-128)*c+128)+lutBright; g1=((g1-128)*c+128)+lutBright; b1=((b1-128)*c+128)+lutBright;
    // saturation
    const y=0.299*r+0.587*g1+0.114*b1;
    r=y+(r-y)*sat; g1=y+(g1-y)*sat; b1=y+(b1-y)*sat;
    data[i]=r; data[i+1]=g1; data[i+2]=b1;
  }
  ctx.putImageData(img,0,0);

  // 簡易銳利（Unsharp，強度由 sSharp 控）
  if(sh>0.1){
    const k=sh*0.5; // 0.05~0.3
    // 取鄰近像素簡化銳化（小性能花費）
    const blur=ctx.getImageData(0,0,W,H);
    const d=img.data, db=blur.data;
    // 3x3 box blur 的近似（一次平移混合）
    ctx.globalAlpha=0.5; ctx.drawImage(cv,1,0); ctx.drawImage(cv,-1,0); ctx.drawImage(cv,0,1); ctx.drawImage(cv,0,-1);
    ctx.globalAlpha=1; const blur2=ctx.getImageData(0,0,W,H); const db2=blur2.data;
    for(let i=0;i<d.length;i+=4){
      const bpx=(db[i]+db2[i])*0.5, bpy=(db[i+1]+db2[i+1])*0.5, bpz=(db[i+2]+db2[i+2])*0.5;
      d[i]=clamp(d[i]+(d[i]-bpx)*k); d[i+1]=clamp(d[i+1]+(d[i+1]-bpy)*k); d[i+2]=clamp(d[i+2]+(d[i+2]-bpz)*k);
    }
    ctx.putImageData(img,0,0);
  }

  autoQualityTick();
}

/* ====== 小工具 ====== */
function clamp(v){return v<0?0:(v>255?255:v)}
function byId(id){return document.getElementById(id)}
</script>
</body>
</html>
